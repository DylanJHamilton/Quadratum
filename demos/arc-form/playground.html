<div class="arc-play" data-arc-play>
  <style>.arc-play{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}.arc-play label{display:block;margin:18px 0;font-size:16px}.arc-play select,.arc-play input{display:block;width:100%;margin-top:10px;min-height:44px}.arc-play__card{padding:clamp(24px,5vw,56px);background:#111;color:#f5f5f1;border-radius:var(--arc-radius,16px)}.arc-play__card h3{font-size:clamp(26px,4vw,44px);line-height:1.1;color:inherit;text-transform:var(--arc-case,none)}.arc-play__card p{color:inherit}.arc-play__card a{display:inline-flex;padding:14px 24px;background:#f5f5f1;color:#111;border-radius:var(--arc-radius,16px);margin-top:20px;text-decoration:none}.arc-play :focus-visible{outline:2px solid currentColor;outline-offset:4px}@media(max-width:749px){.arc-play{grid-template-columns:1fr}}</style>
  <div><p>Try a few visual decisions. These controls change only this sample card.</p><label>Corner radius <input type="range" min="0" max="32" step="2" value="16" data-arc-radius></label><label>Heading style <select data-arc-case><option value="none">Sentence case</option><option value="uppercase">Uppercase</option></select></label><label>Surface <select data-arc-surface><option value="dark">Graphite</option><option value="light">Warm white</option></select></label></div>
  <div class="arc-play__card"><p>ARC//FORM · DESIGN STUDY</p><h3>Everyday. Your way.</h3><p>A few small choices change the feel of the whole composition.</p><a href="/collections/all-products">Explore the objects</a></div>
  <script>(()=>{const root=document.currentScript.closest('[data-arc-play]');const card=root.querySelector('.arc-play__card');root.addEventListener('input',e=>{if(e.target.matches('[data-arc-radius]'))card.style.setProperty('--arc-radius',e.target.value+'px');});root.addEventListener('change',e=>{if(e.target.matches('[data-arc-case]'))card.style.setProperty('--arc-case',e.target.value);if(e.target.matches('[data-arc-surface]')){const light=e.target.value==='light';card.style.background=light?'#f5f5f1':'#111';card.style.color=light?'#111':'#f5f5f1';}});})();</script>
</div>
